<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Canteen Billing System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B85042">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand-logo">🍽️</span>
      <h1 id="login-canteen-title">Canteen Billing System</h1>
      <p>Staff Portal Sign In</p>
    </div>

    <div id="login-error" class="form-error" style="display: none; margin-bottom: 16px;"></div>

    <form id="login-form" onsubmit="return false;">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="username" style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px;">Username</label>
        <input type="text" id="username" placeholder="e.g. admin or cashier1" autocomplete="username" required
               style="width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-warm); border-radius: var(--radius-sm); font-size: 14px; outline: none; transition: border-color 0.2s;">
      </div>

      <div class="form-group" style="margin-bottom: 22px;">
        <label for="password" style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px;">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required
               style="width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-warm); border-radius: var(--radius-sm); font-size: 14px; outline: none; transition: border-color 0.2s;">
      </div>

      <button type="submit" id="submit-login-btn" class="checkout-btn" style="width: 100%; padding: 14px; font-size: 15px;">
        Sign In to POS
      </button>
    </form>

    <div class="demo-credentials-box">
      <strong>🔑 Default Credentials:</strong><br>
      • <strong>Admin:</strong> <code>admin</code> / <code>admin123</code><br>
      • <strong>Cashier:</strong> <code>cashier1</code> / <code>cashier123</code><br>
      <span style="font-size: 11px; color: var(--dark-brown-muted);">Note: Admin will be required to change password on first login.</span>
    </div>
  </div>

  <script src="auth-common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to index
      if (Auth.isAuthenticated()) {
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || 'index.html';
        window.location.href = redirect;
        return;
      }

      const form = document.getElementById('login-form');
      const errEl = document.getElementById('login-error');
      const submitBtn = document.getElementById('submit-login-btn');

      // Check expired notice
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('expired')) {
        errEl.textContent = 'Your session has expired. Please sign in again.';
        errEl.style.display = 'block';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.style.display = 'none';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          errEl.textContent = 'Please enter both username and password.';
          errEl.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || 'Authentication failed.');
          }

          Auth.setAuth(data.token, data.user);

          // If must change password, trigger the forced change modal immediately
          if (data.user.must_change_password) {
            Auth.showForcePasswordChangeModal();
            // Listen for change complete before continuing
            const checkInterval = setInterval(() => {
              const u = Auth.getUser();
              if (u && !u.must_change_password) {
                clearInterval(checkInterval);
                const redirect = urlParams.get('redirect') || 'index.html';
                window.location.href = redirect;
              }
            }, 500);
            return;
          }

          const redirect = urlParams.get('redirect') || 'index.html';
          window.location.href = redirect;
        } catch (err) {
          errEl.textContent = err.message;
          errEl.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to POS';
        }
      });
    });
  </script>
</body>
</html>
